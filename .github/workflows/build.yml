name: Build APK

# Manual run only: GitHub -> Actions -> "Build APK" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The AI models are too big for git, so they live in a GitHub Release named "models-v1".
      - name: Download AI models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/models
          gh release download models-v1 --repo "$GITHUB_REPOSITORY" --pattern '*.onnx' --dir app/src/main/assets/models
          ls -lh app/src/main/assets/models

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Show errors in the run summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |What went wrong|error:' -A3 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: PureEnhanceAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
